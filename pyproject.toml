[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fernando Figueiredo", email = "fernandofigueiredo123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.2",
    "claude-agent-sdk>=0.2.176",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "pyobjc-framework-quartz>=13.0",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
